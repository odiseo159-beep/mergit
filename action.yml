name: Mergit
description: Pay a merged pull request from its on-chain bounty, after checking that the merge and the CI are real.
author: Mergit

# El workflow que la use necesita estos permisos:
#   contents: read        leer el repositorio y los estados del commit
#   checks: read          leer los check runs, que es donde vive el CI moderno
#   statuses: read        leer los estados clásicos del commit, el otro mecanismo de CI
#   pull-requests: write  comentar el recibo en el pull request

branding:
  icon: git-merge
  color: red

inputs:
  agent-key:
    description: >-
      Private key of the bounty's verifier, as a repository secret. Without it the
      action still verifies and reports, but signs nothing: a rehearsal.
    required: false
  github-token:
    description: Token used to read the pull request and comment the receipt.
    required: false
    default: ${{ github.token }}
  pull-request:
    description: Pull request number to re-check. Only needed for a manual run.
    required: false
  node-version:
    description: Node version used to run the agent.
    required: false
    default: "22"

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        # Sin caché de npm: setup-node resuelve la ruta dentro del repositorio que
        # usa la acción, y el package-lock del agente vive fuera de ahí.

    - name: Install the agent
      shell: bash
      working-directory: ${{ github.action_path }}/agent
      run: npm ci --omit=dev

    - name: Verify the merge and settle the bounty
      shell: bash
      working-directory: ${{ github.action_path }}/agent
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        MERGIT_AGENT_KEY: ${{ inputs.agent-key }}
        MERGIT_PR: ${{ inputs.pull-request }}
      run: node on-event.mjs
